<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Transport de la commune urbaine d’Antsirabe">
  <title>Transport de commune urbaine — Antsirabe</title>
  <defs>
    <linearGradient id="tcu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f6350"/>
      <stop offset="0.55" stop-color="#244235"/>
      <stop offset="1" stop-color="#12241b"/>
    </linearGradient>
    <linearGradient id="tcu-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0a8"/>
      <stop offset="0.55" stop-color="#f0b45c"/>
      <stop offset="1" stop-color="#d98f22"/>
    </linearGradient>
    <linearGradient id="tcu-glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eaf6ee"/>
      <stop offset="1" stop-color="#b8cfbf"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#tcu-bg)"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#tcu-gold)" stroke-width="1.7" opacity="0.62"/>
  <circle cx="64" cy="64" r="45.5" fill="none" stroke="#ffe0a8" stroke-width="1" opacity="0.22"/>

  <!-- Collines d'Antsirabe -->
  <path d="M18 88c9-9 16-13 24-13s13 5 20 5 10-7 18-9 14 4 20 9v18H18z" fill="#ffe0a8" opacity="0.10"/>

  <!-- Silhouette de la ville -->
  <g fill="#ffe0a8" opacity="0.20">
    <rect x="26" y="74" width="8" height="17" rx="1.6"/>
    <rect x="37" y="67" width="9" height="24" rx="1.6"/>
    <path d="M49 91V72l5-4 5 4v19z"/>
    <rect x="62" y="70" width="8" height="21" rx="1.6"/>
    <rect x="73" y="64" width="10" height="27" rx="1.6"/>
    <rect x="86" y="71" width="8" height="20" rx="1.6"/>
    <rect x="96" y="77" width="7" height="14" rx="1.6"/>
  </g>

  <!-- Route -->
  <path d="M20 96h88" stroke="#ffe0a8" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <g stroke="#ffe0a8" stroke-width="1.8" stroke-linecap="round" opacity="0.45">
    <path d="M31 101h6"/><path d="M44 101h6"/><path d="M58 101h7"/><path d="M72 101h6"/><path d="M85 101h6"/><path d="M96 101h4"/>
  </g>

  <!-- Bus de face -->
  <g>
    <rect x="34" y="37" width="60" height="49" rx="9" fill="url(#tcu-gold)"/>
    <rect x="38.5" y="41.5" width="51" height="20" rx="5" fill="url(#tcu-glass)" opacity="0.95"/>
    <path d="M64 41.5v20" stroke="#3d6a52" stroke-width="1.6" opacity="0.35"/>
    <rect x="41" y="66" width="12" height="5.5" rx="2.6" fill="#2b3a32" opacity="0.35"/>
    <path d="M62 64h4v9h-4z" fill="#2b3a32" opacity="0.55"/>
    <rect x="75" y="66" width="12" height="5.5" rx="2.6" fill="#2b3a32" opacity="0.35"/>
    <circle cx="45" cy="86" r="5.4" fill="#101a14" stroke="#fff6e4" stroke-width="2.2"/>
    <circle cx="83" cy="86" r="5.4" fill="#101a14" stroke="#fff6e4" stroke-width="2.2"/>
    <rect x="46" y="92" width="36" height="2.6" rx="1.3" fill="#12241b" opacity="0.35"/>
  </g>

  <!-- Étoile de la commune -->
  <path d="M64 15.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z" fill="url(#tcu-gold)"/>
</svg>
